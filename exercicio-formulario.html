<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulário de Candidatura Online</title>
</head>
<body>

<p><a href="index.html#projectos">← Voltar ao portfólio</a></p>

<h1>Formulário de Candidatura Online</h1>
<p>Preencha os campos abaixo. Os campos com * são obrigatórios.</p>

<form action="#" method="post" onsubmit="alert('Candidatura enviada com sucesso!'); return false;">

  <fieldset>
    <legend>Dados Pessoais</legend>

    <p>
      <label for="nome">Nome completo *</label><br>
      <input type="text" id="nome" name="nome" placeholder="Ex.: Leonel Francisco " required>
    </p>

    <p>
      <label for="nascimento">Data de nascimento *</label><br>
      <input type="date" id="nascimento" name="nascimento" required>
    </p>

    <p>
      <label for="telefone">Telefone *</label><br>
      <input type="tel" id="telefone" name="telefone" placeholder="84 000 0000" required>
    </p>

    <p>
      <label for="email">Email *</label><br>
      <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required>
    </p>

    <p>
      Género:<br>
      <input type="radio" id="masc" name="genero" value="M"> <label for="masc">Masculino</label>
      <input type="radio" id="fem" name="genero" value="F"> <label for="fem">Feminino</label>
    </p>
  </fieldset>

  <br>

  <fieldset>
    <legend>Formação Académica</legend>

    <p>
      <label for="nivel">Nível de ensino *</label><br>
      <select id="nivel" name="nivel" required>
        <option value="">-- Seleccione --</option>
        <option>10.ª Classe</option>
        <option>12.ª Classe</option>
        <option>Ensino Técnico Médio</option>
        <option>Licenciatura</option>
      </select>
    </p>

    <p>
      <label for="curso">Curso</label><br>
      <input type="text" id="curso" name="curso" placeholder="Ex.: Técnico de Suporte Informático">
    </p>

    <p>
      Áreas de interesse:<br>
      <input type="checkbox" id="web" name="area" value="web"> <label for="web">Desenvolvimento Web</label><br>
      <input type="checkbox" id="redes" name="area" value="redes"> <label for="redes">Redes</label><br>
      <input type="checkbox" id="suporte" name="area" value="suporte"> <label for="suporte">Suporte Técnico</label><br>
      <input type="checkbox" id="seguranca" name="area" value="seguranca"> <label for="seguranca">Segurança</label>
    </p>
  </fieldset>

  <br>

  <fieldset>
    <legend>Motivação</legend>

    <p>
      <label for="mensagem">Porque quer candidatar-se? *</label><br>
      <textarea id="mensagem" name="mensagem" rows="5" cols="40" required></textarea>
    </p>

    <p>
      <input type="checkbox" id="termos" required>
      <label for="termos">Declaro que as informações fornecidas são verdadeiras. *</label>
    </p>
  </fieldset>

  <p>
    <button type="submit">Enviar candidatura</button>
    <button type="reset">Limpar</button>
  </p>

</form>

</body>
</html>
